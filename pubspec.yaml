name: lachit_scanner
description: "Free, offline, no-watermark document & book scanner."
publish_to: 'none'
version: 13.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera + CV
  camera: ^0.11.0+2
  opencv_dart: ^1.4.5

  # State management
  flutter_riverpod: ^2.5.1

  # Storage
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.2

  # Export
  pdf: ^3.11.1
  share_plus: ^10.1.2

  # Light image ops (rotate/thumbnail) without spinning up OpenCV
  image: ^4.2.0

  cupertino_icons: ^1.0.8
  gal: ^2.3.3
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
